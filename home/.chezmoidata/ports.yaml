# Single source of truth for service ports on the exe.dev VM.
#
# nginx OWNS the nice/external ports (the ones clients and the exe.dev HTTPS
# proxy connect to). Pitchfork daemons bind to the internal ports, which nginx
# reverse-proxies to. Changing a port here updates both the pitchfork daemon
# bind and the nginx listen/proxy_pass on the next `chezmoi apply`.
#
#   external = nginx listen port (the "nice" port, source of truth)
#   internal = pitchfork daemon bind port (loopback only, nginx proxies here)

ports:
  opencode:
    external: 4096
    internal: 4097
  # OpenCode 2 (`opencode2 serve`) has no nginx front today: it binds this port
  # directly, following the OpenCode 1 posture — loopback on macOS and behind
  # nginx, 0.0.0.0 on Linux without one — and is overridable per machine under
  # [data.opencode2.serve]. Its CLI default is 4097 — the port OpenCode 1 owns
  # above — so the port is pinned in ~/.config/opencode2/opencode.json
  # (private_dot_config/opencode2/modify_opencode.json) from this value.
  # Without the pin, a bare `opencode2 serve` lands on OpenCode 1's port.
  opencode2:
    internal: 4098
  mcpproxy:
    external: 9183
    internal: 18321
  edge:
    port: 8000
