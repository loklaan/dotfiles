<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="516" viewBox="0 0 1040 516" role="img" aria-labelledby="statechart-guarded-title statechart-guarded-description"><title id="statechart-guarded-title">One event, two outcomes</title><desc id="statechart-guarded-description">One submit event, two exclusive guards. A valid form is saved; an invalid one explains why and stays correctable.</desc><defs><pattern id="statechart-guarded-dither" width="4" height="4" patternUnits="userSpaceOnUse" shape-rendering="crispEdges"><g fill="#8b97f9"><rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/></g></pattern></defs><g data-component="process"><g fill="url(#statechart-guarded-dither)" stroke="none" transform="translate(8 8)"><path d="M 160 176 H 368 V 248 H 160 Z"/></g><g fill="#e7eefa" stroke="#1155cc" stroke-width="1.2" stroke-linejoin="round"><path d="M 160 176 H 368 V 248 H 160 Z"/></g><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="18" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="264" y="212">Editing</tspan></text></g><g data-component="process"><g fill="url(#statechart-guarded-dither)" stroke="none" transform="translate(8 8)"><path d="M 736 292 H 944 V 364 H 736 Z"/></g><g fill="#ffffff" stroke="#1155cc" stroke-width="1.2" stroke-linejoin="round"><path d="M 736 292 H 944 V 364 H 736 Z"/></g><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="18" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="840" y="328">Invalid</tspan></text></g><g data-component="initial-state"><circle cx="96" cy="212" r="8" fill="#1155cc"/></g><g data-component="final-state"><circle cx="856" cy="96" r="8" fill="#ffffff" stroke="#1155c