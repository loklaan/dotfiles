<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="statechart-recovery-title statechart-recovery-description"><title id="statechart-recovery-title">Retry, with a limit</title><desc id="statechart-recovery-description">A failed attempt waits out a backoff. Counting from attempt 1, the guards allow two retries before terminal failure.</desc><defs><pattern id="statechart-recovery-dither" width="4" height="4" patternUnits="userSpaceOnUse" shape-rendering="crispEdges"><g fill="#8b97f9"><rect x="0" y="0" width="1" height="1"/><rect x="2" y="0" width="1" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/></g></pattern></defs><g data-component="process"><g fill="url(#statechart-recovery-dither)" stroke="none" transform="translate(8 8)"><path d="M 144 144 H 352 V 216 H 144 Z"/></g><g fill="#ffffff" stroke="#1155cc" stroke-width="1.2" stroke-linejoin="round"><path d="M 144 144 H 352 V 216 H 144 Z"/></g><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="18" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="248" y="180">Running</tspan></text></g><g data-component="process"><g fill="url(#statechart-recovery-dither)" stroke="none" transform="translate(8 8)"><path d="M 480 144 H 688 V 216 H 480 Z"/></g><g fill="#e7eefa" stroke="#1155cc" stroke-width="1.2" stroke-linejoin="round"><path d="M 480 144 H 688 V 216 H 480 Z"/></g><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="18" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="584" y="180">Waiting</tspan></text></g><g data-component="process"><g fill="url(#statechart-recovery-dither)" stroke="none" transform="translate(8 8)"><path d="M 768 336 H 976 V 408 H 768 Z"/></g><g fill="#ffffff" stroke="#1155cc" stroke-width="1.2" stroke-linejoin="round"><path d="M 768 336 H 976 V 408 H 768 Z"/></g><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="18" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="872" y="372">Terminal failure</tspan></text></g><g data-component="initial-state"><circle cx="80" cy="180" r="8" fill="#1155cc"/></g><g data-component="final-state"><circle cx="872" cy="180" r="8" fill="#ffffff" stroke="#1155cc" stroke-width="1.2"/><circle cx="872" cy="180" r="4.5" fill="#1155cc"/></g><g data-component="final-state"><circle cx="872" cy="488" r="8" fill="#ffffff" stroke="#1155cc" stroke-width="1.2"/><circle cx="872" cy="488" r="4.5" fill="#1155cc"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 88 180 L 144 180"/><path d="M 135 185 L 144 180 L 135 175" fill="none"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 352 180 L 480 180"/><line x1="352" y1="175" x2="352" y2="185"/><path d="M 471 185 L 480 180 L 471 175" fill="none"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 248 144 L 248 100 Q 248 80 268 80 L 852 80 Q 872 80 872 100 L 872 172"/><line x1="243" y1="144" x2="253" y2="144"/><path d="M 867 163 L 872 172 L 877 163" fill="none"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 584 216 L 584 276 Q 584 296 564 296 L 268 296 Q 248 296 248 276 L 248 216"/><line x1="579" y1="216" x2="589" y2="216"/><path d="M 253 225 L 248 216 L 243 225" fill="none"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 688 180 L 708 180 Q 728 180 728 200 L 728 352 Q 728 372 748 372 L 768 372"/><line x1="688" y1="175" x2="688" y2="185"/><path d="M 759 377 L 768 372 L 759 367" fill="none"/></g><g data-component="line" fill="none" stroke="#1155cc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M 872 408 L 872 480"/><line x1="867" y1="408" x2="877" y2="408"/><path d="M 867 471 L 872 480 L 877 471" fill="none"/></g><g data-component="label"><rect x="385.46" y="150.55" width="61.08" height="26.9" rx="0" fill="#ffffff"/><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="416" y="164">failed</tspan></text></g><g data-component="label"><rect x="516.14" y="66.55" width="87.72" height="26.9" rx="0" fill="#ffffff"/><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="560" y="80">completed</tspan></text></g><g data-component="label"><rect x="349.94" y="263.65" width="132.12" height="64.7" rx="0" fill="#ffffff"/><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="416" y="277.1">after(backoff)</tspan><tspan x="416" y="296">[attempt &lt; 3]</tspan><tspan x="416" y="314.9">/ attempt += 1</tspan></text></g><g data-component="label"><rect x="739.94" y="253.1" width="132.12" height="45.8" rx="0" fill="#ffffff"/><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="806" y="266.55">after(backoff)</tspan><tspan x="806" y="285.45">[attempt &gt;= 3]</tspan></text></g><g data-component="annotation"><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="872" y="212">Completed</tspan></text></g><g data-component="annotation"><text fill="#1155cc" font-family="Paper Mono, monospace" font-size="14" font-weight="400" letter-spacing="0.2" text-anchor="middle" dominant-baseline="middle"><tspan x="872" y="520">Stopped</tspan></text></g></svg>
