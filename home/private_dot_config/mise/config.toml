# Global tools. Every version here is pinned by the committed mise.lock next to
# this file (~/.config/mise/mise.lock), and installs run with `locked = true`
# below, so `chezmoi apply` installs exactly what the lock records: no registry
# or GitHub API resolution happens on the box. Requests such as "latest" or a
# major prefix ("1") only move when the lock is bumped (weekly CI PR, or
# `mise lock --global --bump` by hand; see .agents/skills/update-deps).
#
# Changing a request here means re-locking in the same change. In locked mode a
# request with no matching lock entry is an error, not a fallback.
#
# npm tools also get a dependency sidecar, <config dir>/.mise/locks/<tool>/<ver>,
# which a locked install requires. In the source it lives in dot_mise/ (applied
# to ~/.config/mise/.mise); the committed `.mise -> dot_mise` symlink beside this
# file makes `mise lock` run against the source config write into it.

[tool_alias]
# `opencode` keeps its tool name (installs dir, `mise exec -- opencode`, the
# completion installer and the pitchfork watch path all key on it) but resolves
# through the github backend. The registry's aqua:anomalyco/opencode lists
# only the 2.x releases, so it can no longer resolve OpenCode 1.
opencode = "github:anomalyco/opencode"

[tools]
"github:bitwarden/sdk" = { version = "bws-v2.1.0", exe = "bws", tag_regex = "^bws" }
"github:psastras/sarif-rs" = { version = "sarif-fmt-v0.8.0", exe = "sarif-fmt", matching = "sarif-fmt", tag_regex = "^sarif-fmt" }
# RTK — Rust CLI that rewrites shell commands to compact output, saving 60-90%
# of token spend on common dev commands (git status, ls, cargo test, etc.).
# Installed on every machine. Its OpenCode plugin (~/.config/opencode/plugins/
# rtk.ts) is not in this repo: run_onchange_after_install-068 generates it
# with `rtk init -g --opencode` whenever mise.lock changes.
"github:rtk-ai/rtk" = { version = "v0.50.0", exe = "rtk" }
# tmux's official prebuilt binary: no source build; the asdf plugin cannot build 3.7 on macOS.
"github:tmux/tmux-builds" = "3.7c"
# Linux only: macOS installs mcpproxy from its Homebrew cask. The lock still
# carries both platforms; `os` only gates install and activation.
"github:smart-mcp-proxy/mcpproxy-go" = { version = "0.70.0", exe = "mcpproxy", os = ["linux"] }
# usage — jdx's CLI shell-completion runtime. Required by pitchfork's
# `completion` subcommand; kept next to pitchfork since they're paired.
usage = "6.12.0"
"github:jdx/pitchfork" = { version = "2.29.0", exe = "pitchfork" }
"npm:@kitlangton/skulk" = "0.1.0"
age = "latest"
ast-grep = "latest"
bitwarden = "2026.9.0"
bun = "1.4.2"
chezmoi = "2.73.0"
claude = "latest"
d2 = "0.9.0"
delta = "0.19.2"
deno = "2.9.7"
difftastic = "0.71.0"
fzf = "0.74.4"
gh = "latest"
go = "1.27.1"
jq = "latest"
yq = "latest"
micro = "latest"
node = "26.10.0"
# OpenCode 1. "1" rather than "latest": `latest` on the repo would jump to 2.x,
# which is a separate binary installed as opencode2 (see below).
opencode = "1"
python = "3.14"
ripgrep = "latest"
rust = "1.98.1"
shellcheck = "0.11.0"
starship = "1.26.0"
uv = "0.12.21"

[env]
DISABLE_AUTOUPDATER = "1"
DENO_NO_UPDATE_CHECK = "1"
# mise's own (tera) templating: this file is not a chezmoi template.
SKULK_OPENCODE = "{{ env.HOME }}/.local/bin/opencode2"
SKULK_ALLOW_EXEC = "0"

[settings]
# Supply-chain gate. Installs must come from mise.lock (no resolution on the
# box). Scoped to this global config only: project configs, such as the canva
# monorepo's, keep their own lockfile policy and are not forced into locked mode.
locked = true
locked_scopes = ["global"]
# Fuzzy requests ("latest", "3.14") resolve only to releases at least 4 days
# old. Applies when the lock is bumped, and to npm transitive deps as they are
# resolved. Exact pins are not filtered, and locked installs replay the lock.
minimum_release_age = "4d"
# Every machine is Apple Silicon or an x86-64 Coder box. Bump CI runs on
# macos-arm64, and mise always adds the current platform.
lockfile_platforms = ["macos-arm64", "linux-x64"]
idiomatic_version_file_enable_tools = ["node"]
experimental = true
gix = false
# Shims in ~/.local/share/mise/shims are symlinks to the mise binary itself, and
# that dir is first on PATH. With auto-install enabled, a shim invoked for a
# not-yet-installed tool re-enters mise to install it — which deadlocks when the
# caller IS mise installing that same tool. A source build makes this reachable:
# CPython's ./configure probes `python3.13 -V` to bootstrap itself, PATH resolves
# that to the shim, the shim tries to install python@3.13, and it blocks forever
# on the tool-version flock its own grandparent build already holds. Its nested
# python-build then spawns another ./configure, so the cycle compounds. Observed
# on a Coder box: `mise install` hung 1h45m with no output, and because
# install-my-packages runs it via run_quiet under a non-TTY `chezmoi apply`, a
# fresh workspace wedges silently and permanently.
# Disabling this severs the cycle at its only active step. Shims for INSTALLED
# tools are unaffected; a shim for a missing tool now fails fast instead of
# self-installing, which is correct here — installs come from `mise install`
# during `chezmoi apply`, not from incidental shim calls.
not_found_auto_install = false

[settings.github]
credential_command = "gh auth token"

# ── Tasks ────────────────────────────────────────────────────────────────────
# Task bodies are hoisted into ~/.local/bin/dotfiles-task-* scripts so they
# follow the repo's standard script header pattern (set -euo pipefail, doc
# block, bash-logging) and can be debugged in isolation. Task entries here
# are thin dispatchers + dependency declarations.

[tasks.update]
description = "Bump mise.lock in the dotfiles source, upgrade brew, pull the source, then converge chezmoi state"
# One wrapper owns the whole update so the session log covers the mise and git
# phases too; see executable_df-task-update.
run = "df-task-update"

[tasks."mise:upgrade"]
description = "Bump the source repo's mise.lock (`mise lock --global --bump`), then `mise install --locked`"
hide = true
run = "df-task-mise-upgrade"

[tasks."effect-v4:install"]
description = "Install the checksum-pinned Effect v4 source reference"
hide = true
run = "df-effect-v4-reference install"

[tasks."chezmoi:apply"]
description = "Apply chezmoi (converges dotfiles + lifecycle scripts)"
hide = true
run = "df-task-chezmoi-apply"

[tasks."chezmoi:update"]
description = "Pull source repo + apply (TTY-aware non-interactive fallback)"
hide = true
run = "df-task-chezmoi-update"

# ── Hooks ────────────────────────────────────────────────────────────────────
# No postinstall hook here. A `postinstall = { task = "chezmoi:apply" }` hook
# re-enters chezmoi apply from inside mise install/upgrade, which is itself
# invoked from `run_onchange_after_install-050-install-packages.sh` during an outer
# `chezmoi apply`. Chezmoi serializes apply via a persistent-state lock, so
# the nested apply deadlocks with "timeout obtaining persistent state lock".
# Convergence is already delivered by the outer apply: lifecycle scripts run
# later in the same chezmoi apply, after install-050 returns.
