[tools]

# The linter is the manifest's only parser: `list-deno` emits the deno file list
# for the lint task below, so there is no second YAML implementation to keep in
# step (and no PyYAML dependency).
[tasks."lint:runtimes"]
description = "Check every runnable is in the runtime-tier manifest with matching lang"
run = "deno run -q --no-prompt --allow-read --allow-env --allow-run home/private_dot_local/bin/executable_df-lint-runtimes"

[tasks."lint:list-deno"]
description = "Print the manifest's deno runnables (space-separated)"
hide = true
run = "deno run -q --no-prompt --allow-read --allow-env --allow-run home/private_dot_local/bin/executable_df-lint-runtimes list-deno"

# `deno fmt`/`deno lint` SILENTLY SKIP .tmpl files, so the templated deno tools
# were never checked by the task below. This renders them through chezmoi into a
# mirror of the deployed layout (so their ../lib/*.ts imports resolve) and
# type-checks and lints them there.
#
# fmt is deliberately NOT checked here. Formatting depends on the rendered text,
# and rendered text depends on machine data: df-opencode-cost's host list decides
# whether `deno fmt` wants an assignment joined or split, so no single source form
# is clean on every machine. check and lint are width-independent, so they gate
# cleanly. Keep .tmpl formatting tidy by rendering and inspecting by hand.
[tasks."lint:tmpl"]
description = "Type-check and lint the templated deno tools via a chezmoi render"
run = """
set -eu
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/bin" "$tmp/lib"
cp home/private_dot_local/lib/*.ts "$tmp/lib/"
cp deno.json deno.lock "$tmp/"
for src in $(mise run lint:list-deno); do
  case "$src" in
    *.tmpl) ;;
    *) continue ;;
  esac
  name=$(basename "$src" .tmpl)
  name=${name#executable_}
  chezmoi cat "$HOME/.local/bin/$name" > "$tmp/bin/$name"
done
deno lint --rules-exclude=no-import-prefix --ext=ts "$tmp"/bin/*
for f in "$tmp"/bin/*; do
  deno check --config "$tmp/deno.json" "$f"
done
"""

# The new-tool template seeds every new tool but is not a manifest runnable, so
# no other task reads it. Gate it like a tool: type-check, run its
# zero-permission tests, format-check and lint.
[tasks."lint:template"]
description = "Type-check, test, format-check and lint the new-tool template"
run = [
  "deno check --config deno.json .agents/skills/coding-chezmoi/references/deno-effect-tool.template.ts",
  "deno test --config deno.json .agents/skills/coding-chezmoi/references/deno-effect-tool.template.ts",
  "deno fmt --check .agents/skills/coding-chezmoi/references/deno-effect-tool.template.ts",
  "deno lint --rules-exclude=no-import-prefix .agents/skills/coding-chezmoi/references/deno-effect-tool.template.ts",
]

[tasks.lint]
description = "Format-check, lint, and tier-check all Deno+Effect tools"
depends = ["lint:runtimes", "lint:tmpl", "lint:template"]
run = [
  "deno fmt --ext=ts --check $(mise run lint:list-deno)",
  "deno fmt --check .agents/skills/coding-chezmoi/references/deno-effect-tools.md",
  "deno lint --rules-exclude=no-import-prefix --ext=ts $(mise run lint:list-deno)",
]
